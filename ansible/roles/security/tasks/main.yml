---
- name: Install Fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Create Fail2ban jail configuration
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 3
      backend  = systemd

      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      maxretry = 3
      bantime  = 3600

- name: Start and enable Fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: Set SSH MaxAuthTries to 3
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 3'
    state: present

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present

- name: Restart SSH service
  systemd:
    name: ssh
    state: restarted

- name: CIS 1.1 - Disable unused filesystems
  copy:
    dest: /etc/modprobe.d/cis-hardening.conf
    content: |
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install udf /bin/true

- name: CIS 3.1 - Disable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    state: present
    reload: yes

- name: CIS 3.2 - Disable send packet redirects
  sysctl:
    name: net.ipv4.conf.all.send_redirects
    value: '0'
    state: present
    reload: yes

- name: CIS 3.3 - Disable ICMP redirect acceptance
  sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: '0'
    state: present
    reload: yes

- name: CIS 3.4 - Enable TCP SYN cookies
  sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    state: present
    reload: yes

- name: CIS 4.1 - Set permissions on /etc/passwd
  file:
    path: /etc/passwd
    owner: root
    group: root
    mode: '0644'

- name: CIS 4.2 - Set permissions on /etc/shadow
  file:
    path: /etc/shadow
    owner: root
    group: shadow
    mode: '0640'

- name: CIS 5.1 - Set password minimum length
  lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_LEN'
    line: 'PASS_MIN_LEN 14'
    state: present

- name: CIS 5.2 - Set password maximum age
  lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: 'PASS_MAX_DAYS 90'
    state: present

- name: CIS 5.3 - Set password minimum age
  lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_DAYS'
    line: 'PASS_MIN_DAYS 7'
    state: present

- name: Install Lynis security auditing tool
  apt:
    name: lynis
    state: present
    update_cache: yes
  when: inventory_hostname == 'node03'

- name: Run Lynis security audit
  command: lynis audit system --no-colors --quiet
  when: inventory_hostname == 'node03'
  ignore_errors: yes
  register: lynis_output

- name: Save Lynis report
  copy:
    content: "{{ lynis_output.stdout }}"
    dest: /tmp/lynis-report.txt
  when: inventory_hostname == 'node03'

- name: Install libpam-tmpdir for PAM sessions
  apt:
    name: libpam-tmpdir
    state: present

- name: Install debsums for package verification
  apt:
    name: debsums
    state: present

- name: Install apt-show-versions for patch management
  apt:
    name: apt-show-versions
    state: present

- name: Disable core dumps
  lineinfile:
    path: /etc/security/limits.conf
    line: '* hard core 0'
    state: present

- name: Set strict umask in login.defs
  lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK'
    line: 'UMASK 027'
    state: present

- name: Configure password hashing rounds
  lineinfile:
    path: /etc/login.defs
    regexp: '^#?SHA_CRYPT_MIN_ROUNDS'
    line: 'SHA_CRYPT_MIN_ROUNDS 10000'
    state: present

- name: Install pam_pwquality for password strength
  apt:
    name: libpam-pwquality
    state: present

- name: Configure password quality requirements
  lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^# minlen', line: 'minlen = 14' }
    - { regexp: '^# dcredit', line: 'dcredit = -1' }
    - { regexp: '^# ucredit', line: 'ucredit = -1' }
    - { regexp: '^# ocredit', line: 'ocredit = -1' }
    - { regexp: '^# lcredit', line: 'lcredit = -1' }

- name: Disable USB storage
  copy:
    dest: /etc/modprobe.d/usb-storage.conf
    content: |
      install usb-storage /bin/true

- name: Install auditd system auditing
  apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Enable and start auditd
  systemd:
    name: auditd
    state: started
    enabled: yes

- name: Configure audit rules
  copy:
    dest: /etc/audit/rules.d/cis-hardening.rules
    content: |
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/sudoers -p wa -k scope
      -w /var/log/auth.log -p wa -k logins
      -w /var/log/syslog -p wa -k logins

- name: CIS kernel hardening - additional sysctl parameters
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
    - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
    - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
    - { name: 'kernel.randomize_va_space', value: '2' }
    - { name: 'fs.suid_dumpable', value: '0' }


- name: Install apt-listchanges
  apt:
    name: apt-listchanges
    state: present

- name: Disable unused network protocols
  copy:
    dest: /etc/modprobe.d/disable-protocols.conf
    content: |
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true

- name: Set password expiry for ubuntu user
  command: chage --maxdays 90 ubuntu
  ignore_errors: yes

- name: Set inactive password lock
  lineinfile:
    path: /etc/login.defs
    regexp: '^#?INACTIVE'
    line: 'INACTIVE=30'
    state: present
